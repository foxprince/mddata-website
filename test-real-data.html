<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真实数据测试 - MDdata</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .log-entry {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">🧪 真实市场数据测试</h1>
            <p class="text-gray-600">测试 Finnhub API 和 Binance WebSocket 连接</p>
        </div>

        <!-- 控制面板 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">控制面板</h2>
            <div class="flex gap-4">
                <button onclick="testStocks()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    测试股票数据
                </button>
                <button onclick="testForex()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                    测试外汇数据
                </button>
                <button onclick="testCrypto()" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">
                    测试加密货币数据
                </button>
                <button onclick="startWebSocket()" class="px-4 py-2 bg-orange-600 text-white rounded hover:bg-orange-700">
                    启动 WebSocket
                </button>
                <button onclick="clearLogs()" class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">
                    清空日志
                </button>
            </div>
        </div>

        <!-- 数据显示区 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <!-- 股票数据 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-bold mb-4">📈 股票数据</h3>
                <div id="stock-data" class="space-y-2 text-sm font-mono"></div>
            </div>

            <!-- 外汇数据 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-bold mb-4">💱 外汇数据</h3>
                <div id="forex-data" class="space-y-2 text-sm font-mono"></div>
            </div>

            <!-- 加密货币数据 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-bold mb-4">₿ 加密货币数据</h3>
                <div id="crypto-data" class="space-y-2 text-sm font-mono"></div>
            </div>

            <!-- WebSocket 状态 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-bold mb-4">🔌 WebSocket 实时推送</h3>
                <div id="websocket-status" class="mb-4">
                    <span class="px-3 py-1 bg-gray-200 text-gray-700 rounded-full text-sm">未连接</span>
                </div>
                <div id="websocket-data" class="space-y-2 text-sm font-mono max-h-64 overflow-y-auto"></div>
            </div>
        </div>

        <!-- 日志区 -->
        <div class="bg-gray-900 rounded-lg shadow-lg p-6 text-green-400 font-mono text-sm">
            <h3 class="text-lg font-bold mb-4 text-white">📋 系统日志</h3>
            <div id="logs" class="space-y-1 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <script src="js/real-data-fetcher.js"></script>
    <script>
        let fetcher;
        let wsConnected = false;

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            fetcher = new RealDataFetcher({
                finnhubApiKey: 'demo',
                useFallback: false
            });
            addLog('✅ 数据获取器初始化完成', 'success');
        });

        // 添加日志
        function addLog(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                success: 'text-green-400',
                error: 'text-red-400',
                warning: 'text-yellow-400',
                info: 'text-blue-400'
            };
            const entry = document.createElement('div');
            entry.className = `log-entry ${colors[type]}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logs.insertBefore(entry, logs.firstChild);
            
            // 限制日志数量
            if (logs.children.length > 100) {
                logs.removeChild(logs.lastChild);
            }
        }

        // 测试股票数据
        async function testStocks() {
            addLog('🔄 正在获取股票数据...', 'info');
            const container = document.getElementById('stock-data');
            container.innerHTML = '<div class="text-gray-400">加载中...</div>';
            
            try {
                const data = await fetcher.getStockQuotes();
                container.innerHTML = '';
                
                data.forEach(stock => {
                    const color = stock.change >= 0 ? 'text-green-600' : 'text-red-600';
                    const div = document.createElement('div');
                    div.className = 'p-2 bg-gray-50 rounded';
                    div.innerHTML = `
                        <div class="font-bold">${stock.symbol}</div>
                        <div>价格: $${stock.price.toFixed(2)}</div>
                        <div class="${color}">涨跌: ${stock.change.toFixed(2)} (${stock.changePercent.toFixed(2)}%)</div>
                    `;
                    container.appendChild(div);
                });
                
                addLog(`✅ 成功获取 ${data.length} 个股票数据`, 'success');
            } catch (error) {
                container.innerHTML = `<div class="text-red-500">错误: ${error.message}</div>`;
                addLog(`❌ 获取股票数据失败: ${error.message}`, 'error');
            }
        }

        // 测试外汇数据
        async function testForex() {
            addLog('🔄 正在获取外汇数据...', 'info');
            const container = document.getElementById('forex-data');
            container.innerHTML = '<div class="text-gray-400">加载中...</div>';
            
            try {
                const data = await fetcher.getForexQuotes();
                container.innerHTML = '';
                
                data.forEach(forex => {
                    const color = forex.change >= 0 ? 'text-green-600' : 'text-red-600';
                    const div = document.createElement('div');
                    div.className = 'p-2 bg-gray-50 rounded';
                    div.innerHTML = `
                        <div class="font-bold">${forex.symbol}</div>
                        <div>汇率: ${forex.price.toFixed(4)}</div>
                        <div class="${color}">涨跌: ${forex.change.toFixed(4)} (${forex.changePercent.toFixed(2)}%)</div>
                    `;
                    container.appendChild(div);
                });
                
                addLog(`✅ 成功获取 ${data.length} 个外汇数据`, 'success');
            } catch (error) {
                container.innerHTML = `<div class="text-red-500">错误: ${error.message}</div>`;
                addLog(`❌ 获取外汇数据失败: ${error.message}`, 'error');
            }
        }

        // 测试加密货币数据
        async function testCrypto() {
            addLog('🔄 正在获取加密货币数据...', 'info');
            const container = document.getElementById('crypto-data');
            container.innerHTML = '<div class="text-gray-400">加载中...</div>';
            
            try {
                const data = await fetcher.getCryptoQuotes();
                container.innerHTML = '';
                
                data.forEach(crypto => {
                    const color = crypto.changePercent >= 0 ? 'text-green-600' : 'text-red-600';
                    const div = document.createElement('div');
                    div.className = 'p-2 bg-gray-50 rounded';
                    div.innerHTML = `
                        <div class="font-bold">${crypto.symbol}</div>
                        <div>价格: $${crypto.price.toFixed(2)}</div>
                        <div class="${color}">24h: ${crypto.changePercent.toFixed(2)}%</div>
                    `;
                    container.appendChild(div);
                });
                
                addLog(`✅ 成功获取 ${data.length} 个加密货币数据`, 'success');
            } catch (error) {
                container.innerHTML = `<div class="text-red-500">错误: ${error.message}</div>`;
                addLog(`❌ 获取加密货币数据失败: ${error.message}`, 'error');
            }
        }

        // 启动 WebSocket
        function startWebSocket() {
            if (wsConnected) {
                addLog('⚠️ WebSocket 已经连接', 'warning');
                return;
            }
            
            addLog('🔄 正在启动 WebSocket...', 'info');
            const statusEl = document.getElementById('websocket-status');
            statusEl.innerHTML = '<span class="px-3 py-1 bg-yellow-200 text-yellow-700 rounded-full text-sm">连接中...</span>';
            
            fetcher.startCryptoWebSocket((update) => {
                if (!wsConnected) {
                    wsConnected = true;
                    statusEl.innerHTML = '<span class="px-3 py-1 bg-green-200 text-green-700 rounded-full text-sm">✅ 已连接</span>';
                    addLog('✅ WebSocket 连接成功', 'success');
                }
                
                const container = document.getElementById('websocket-data');
                const color = update.changePercent >= 0 ? 'text-green-600' : 'text-red-600';
                const entry = document.createElement('div');
                entry.className = 'log-entry p-2 bg-gray-50 rounded';
                entry.innerHTML = `
                    <span class="font-bold">${update.symbol}</span>
                    <span class="ml-2">$${update.price.toFixed(2)}</span>
                    <span class="ml-2 ${color}">${update.changePercent.toFixed(2)}%</span>
                `;
                container.insertBefore(entry, container.firstChild);
                
                // 限制显示数量
                if (container.children.length > 20) {
                    container.removeChild(container.lastChild);
                }
                
                addLog(`📊 ${update.symbol}: $${update.price.toFixed(2)} (${update.changePercent.toFixed(2)}%)`, 'info');
            });
        }

        // 清空日志
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            addLog('🗑️ 日志已清空', 'info');
        }
    </script>
</body>
</html>
